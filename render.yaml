databases:
  - name: genx-league-db
    plan: free
    databaseName: genx_league

services:
  - type: web
    name: genx-league-calendar
    runtime: go
    plan: free
    buildCommand: go mod tidy && go build -o server .
    startCommand: ./server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: genx-league-db
          property: connectionString
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://genx-league-calendar.onrender.com
